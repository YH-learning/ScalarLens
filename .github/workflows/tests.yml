name: reproduction-check
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python scripts/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-validation
          path: outputs/validation/
